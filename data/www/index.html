<!DOCTYPE html><html lang='zh-CN'><head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>AirPlay 接收器</title>
<style>
:root{
  --accent:#e94560;--accent-hover:#ff5c78;--accent-soft:rgba(233,69,96,0.15);
  --bg-card:rgba(255,255,255,0.06);--bg-input:rgba(0,0,0,0.28);
  --border:rgba(255,255,255,0.12);--text:#f5f5f7;--text-dim:#9aa0ac;
  --ok:#2dc98a;--err:#ff5a5a;--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  background:radial-gradient(circle at 20% 0%,#243b6b 0%,#1a1a2e 45%,#0f1220 100%);
  min-height:100vh;padding:24px 16px;color:var(--text);-webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto}
.header{text-align:center;padding:20px 0 32px}
.header .logo{
  width:64px;height:64px;margin:0 auto 16px;border-radius:20px;
  background:linear-gradient(135deg,var(--accent),#8a2be2);
  display:flex;align-items:center;justify-content:center;font-size:32px;
  box-shadow:0 10px 30px rgba(233,69,96,0.35);
}
.header h1{font-size:30px;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px}
.header p{color:var(--text-dim);font-size:14px}
.status-bar{
  background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
  padding:16px 18px;margin-bottom:22px;text-align:center;font-size:15px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.3s;
}
.status-bar::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--text-dim);flex:0 0 auto}
.status-bar.ok{background:rgba(45,201,138,0.12);border-color:rgba(45,201,138,0.3)}
.status-bar.ok::before{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status-bar.err{background:rgba(255,90,90,0.1);border-color:rgba(255,90,90,0.3)}
.status-bar.err::before{background:var(--err);box-shadow:0 0 10px var(--err)}
.card{
  background:var(--bg-card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:var(--radius);padding:22px;margin-bottom:18px;border:1px solid var(--border);
  box-shadow:0 8px 32px rgba(0,0,0,0.18);
}
.card h2{font-size:17px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.card h2 .ico{font-size:19px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:8px;font-weight:500;letter-spacing:0.3px}
input[type=text],input[type=password]{
  width:100%;padding:13px 15px;background:var(--bg-input);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:15px;transition:border-color 0.2s,box-shadow 0.2s;
}
input[type=text]::placeholder,input[type=password]::placeholder{color:#6b7280}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 22px;border:none;border-radius:10px;font-size:15px;font-weight:600;
  cursor:pointer;transition:transform 0.12s,background 0.2s,box-shadow 0.2s;font-family:inherit;
}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(233,69,96,0.35)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:rgba(255,255,255,0.08);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:rgba(255,255,255,0.14)}
.btn-danger{background:rgba(255,90,90,0.15);color:#ff8080;border:1px solid rgba(255,90,90,0.3)}
.btn-danger:hover{background:rgba(255,90,90,0.25)}
.btn-block{width:100%;margin-top:12px}
.btn:disabled{opacity:0.45;cursor:not-allowed;transform:none}
.wifi-list{max-height:200px;overflow-y:auto;margin:14px 0;display:flex;flex-direction:column;gap:6px}
.wifi-list::-webkit-scrollbar{width:6px}
.wifi-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.wifi-item{
  padding:13px 15px;background:var(--bg-input);border:1px solid transparent;border-radius:10px;
  cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all 0.15s;
}
.wifi-item:hover{background:var(--accent-soft)}
.wifi-item.sel{background:var(--accent-soft);border-color:var(--accent)}
.wifi-item .ssid{font-weight:500;font-size:15px}
.wifi-item .rssi{font-size:12px;color:var(--text-dim)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.info-item{background:var(--bg-input);padding:14px;border-radius:12px;border:1px solid var(--border)}
.info-item label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:6px;letter-spacing:0.3px}
.info-item span{font-size:15px;font-weight:600;word-break:break-all}
.msg{padding:11px 14px;border-radius:10px;margin-top:12px;font-size:13px;font-weight:500}
.msg.ok{background:rgba(45,201,138,0.15);color:#5eead4;border:1px solid rgba(45,201,138,0.3)}
.msg.err{background:rgba(255,90,90,0.15);color:#ff9b9b;border:1px solid rgba(255,90,90,0.3)}
.msg.info{background:rgba(90,150,255,0.12);color:#9dc0ff;border:1px solid rgba(90,150,255,0.25)}
.file-row{display:flex;gap:12px;align-items:center}
.file-name{flex:1;font-size:13px;color:var(--text-dim)}
.actions{display:flex;gap:12px;margin-top:14px}
.slider-row{display:flex;align-items:center;gap:14px}
.slider-row input[type=range]{flex:1;accent-color:var(--accent);height:6px}
.slider-row span{font-size:14px;color:var(--text-dim);min-width:42px;text-align:right;font-weight:600}
.link-card{display:flex;align-items:center;justify-content:space-between;gap:14px}
.link-card .desc{flex:1}
.link-card .desc p{color:var(--text-dim);font-size:13px;margin-top:4px}
.footer{text-align:center;color:var(--text-dim);font-size:12px;padding:16px 0 8px}
</style></head><body>
<div class='wrap'>
<div class='header'>
<div class='logo'>🎵</div>
<h1>AirPlay 接收器</h1><p>ESP32 配置面板</p></div>
<div id='status-bar' class='status-bar'>加载中...</div>
<div class='card'><h2><span class='ico'>📶</span>WiFi 网络</h2>
<button class='btn btn-secondary' onclick='scanWiFi()'>🔍 扫描网络</button>
<div id='wifi-list' class='wifi-list'></div>
<div class='form-group'><label>网络名称 (SSID)</label><input type='text' id='wifi-ssid' placeholder='输入或选择网络'></div>
<div class='form-group'><label>密码</label><input type='password' id='wifi-pass' placeholder='输入密码'></div>
<button class='btn btn-primary btn-block' onclick='saveWiFi()'>连接 WiFi</button>
<div id='wifi-msg'></div></div>
<div class='card'><h2><span class='ico'>⚙️</span>设备设置</h2>
<div class='form-group'><label>AirPlay 设备名称</label><input type='text' id='dev-name' placeholder='我的音箱'></div>
<button class='btn btn-primary' onclick='saveName()'>保存名称</button>
<div id='name-msg'></div>
<div class='form-group' style='margin-top:20px'><label for='led-brightness'>LED 亮度</label>
<div class='slider-row'><input type='range' id='led-brightness' min='0' max='255' value='128' oninput='document.getElementById("led-pct").textContent=Math.round(this.value/255*100)+"%"'>
<span id='led-pct'>50%</span></div></div>
<button class='btn btn-secondary' onclick='saveBrightness()'>保存亮度</button>
<div id='brightness-msg'></div></div>
<div class='card'><h2><span class='ico'>⬆️</span>固件更新</h2>
<div class='file-row'><input type='file' id='fw-file' accept='.bin' style='display:none'>
<button class='btn btn-secondary' onclick='document.getElementById("fw-file").click()'>选择文件</button>
<span class='file-name' id='fw-name'>未选择文件</span></div>
<button class='btn btn-primary btn-block' id='ota-btn' onclick='startOTA()' disabled>上传固件</button>
<div id='ota-msg'></div></div>
<div class='card'><h2><span class='ico'>📊</span>系统信息</h2>
<div class='info-grid'>
<div class='info-item'><label>IP 地址</label><span id='info-ip'>-</span></div>
<div class='info-item'><label>MAC 地址</label><span id='info-mac'>-</span></div>
<div class='info-item'><label>设备名称</label><span id='info-name'>-</span></div>
<div class='info-item'><label>可用内存</label><span id='info-heap'>-</span></div>
<div class='info-item'><label>固件版本</label><span id='info-fw'>-</span></div>
<div class='info-item'><label>WiFi 名称</label><span id='info-ssid'>-</span></div>
<div class='info-item'><label>WiFi 信号</label><span id='info-rssi'>-</span></div>
<div class='info-item'><label>WiFi 信道</label><span id='info-chan'>-</span></div>
<div class='info-item'><label>WiFi 协议</label><span id='info-phy'>-</span></div>
<div class='info-item' style='grid-column:1/-1'><label>WiFi BSSID</label><span id='info-bssid'>-</span></div>
</div>
<div class='actions'><button class='btn btn-danger' onclick='restart()'>重启设备</button></div>
</div>
<div class='card'><div class='link-card'><div class='desc'><h2 style='margin:0'><span class='ico'>📜</span>系统日志</h2>
<p>通过 WebSocket 实时查看 ESP 日志输出</p></div>
<a href='/logs' class='btn btn-primary'>打开</a></div></div>
<div class='card'><div class='link-card'><div class='desc'><h2 style='margin:0'><span class='ico'>🚀</span>WiFi 测速</h2>
<p>测量到本设备的延迟和吞吐量</p></div>
<a href='/speedtest' class='btn btn-primary'>打开</a></div></div>
<div class='card' id='eq-card' style='display:none'><div class='link-card'><div class='desc'><h2 style='margin:0'><span class='ico'>🎚️</span>均衡器</h2>
<p>用于 DAC 调音的 15 段参数均衡器</p></div>
<a href='/eq' class='btn btn-primary'>打开</a></div></div>
<div class='footer'>ESP32 AirPlay 2 接收器</div>
</div>
<script>
function msg(id,txt,type){var e=document.getElementById(id);if(e){e.innerHTML='<div class="msg '+type+'">'+txt+'</div>';setTimeout(function(){e.innerHTML='';},4000);}}
async function scanWiFi(){
  var l=document.getElementById('wifi-list');l.innerHTML='<div class="msg info">扫描中...</div>';
  try{var r=await fetch('/api/wifi/scan');var d=await r.json();
    if(d.success&&d.networks.length>0){l.innerHTML='';d.networks.forEach(function(n){
      var i=document.createElement('div');i.className='wifi-item';
      i.innerHTML='<span class="ssid">'+n.ssid+'</span><span class="rssi">'+n.rssi+' dBm</span>';
      i.onclick=function(){document.querySelectorAll('.wifi-item').forEach(function(x){x.classList.remove('sel');});i.classList.add('sel');document.getElementById('wifi-ssid').value=n.ssid;};
      l.appendChild(i);});}
    else{l.innerHTML='<div class="msg info">未发现网络</div>';}}
  catch(e){l.innerHTML='<div class="msg err">扫描失败</div>';}}
async function saveWiFi(){
  var s=document.getElementById('wifi-ssid').value.trim();var p=document.getElementById('wifi-pass').value;
  if(!s){msg('wifi-msg','请输入网络名称','err');return;}
  try{var r=await fetch('/api/wifi/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid:s,password:p})});
    var d=await r.json();if(d.success){msg('wifi-msg','已保存！正在重启...','ok');}else{msg('wifi-msg',d.error,'err');}}
  catch(e){msg('wifi-msg','出错了','err');}}
async function loadBrightness(){
  try{var r=await fetch('/api/led/brightness');var d=await r.json();
    if(d.success){var s=document.getElementById('led-brightness');s.value=d.brightness;
      document.getElementById('led-pct').textContent=Math.round(d.brightness/255*100)+'%';}}
  catch(e){console.warn('无法加载 LED 亮度',e);}}
async function saveBrightness(){
  var v=Number.parseInt(document.getElementById('led-brightness').value,10);
  try{var r=await fetch('/api/led/brightness',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brightness:v})});
    var d=await r.json();if(d.success){msg('brightness-msg','已保存！','ok');}else{msg('brightness-msg',d.error,'err');}}
  catch(e){msg('brightness-msg','出错了','err');console.error('saveBrightness failed',e);}}
async function saveName(){
  var n=document.getElementById('dev-name').value.trim();if(!n){msg('name-msg','请输入名称','err');return;}
  try{var r=await fetch('/api/device/name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});
    var d=await r.json();if(d.success){msg('name-msg','已保存！重启后生效。','ok');loadInfo();}else{msg('name-msg',d.error,'err');}}
  catch(e){msg('name-msg','出错了','err');}}
async function startOTA(){
  var f=document.getElementById('fw-file').files[0];if(!f){msg('ota-msg','请选择文件','err');return;}
  document.getElementById('ota-btn').disabled=true;msg('ota-msg','上传中...','info');
  try{await fetch('/api/ota/update',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f});msg('ota-msg','完成！正在重启...','ok');}
  catch(e){msg('ota-msg','正在重启...','ok');}}
async function restart(){
  if(!confirm('确定要重启设备吗？'))return;
  try{await fetch('/api/system/restart',{method:'POST'});msg('','正在重启...','info');}catch(e){}}
async function loadInfo(){
  try{var r=await fetch('/api/system/info');var d=await r.json();
    if(d.success){var i=d.info;var b=document.getElementById('status-bar');
      if(i.eth_connected){b.className='status-bar ok';b.innerHTML='以太网已连接：'+i.ip;}
      else if(i.wifi_connected){b.className='status-bar ok';b.innerHTML='WiFi 已连接：'+i.ip;}
      else{b.className='status-bar err';b.innerHTML='未连接 - 请在下方配置 WiFi';}
      document.getElementById('info-ip').textContent=i.ip||'-';
      document.getElementById('info-mac').textContent=i.mac||'-';
      document.getElementById('info-name').textContent=i.device_name||'-';
      document.getElementById('info-heap').textContent=Math.round(i.free_heap/1024)+' KB';
      document.getElementById('info-fw').textContent=i.firmware_version||'-';
      function rssiLabel(r){if(r==null)return '-';var q='';if(r>=-55)q='（极佳）';else if(r>=-65)q='（良好）';else if(r>=-75)q='（一般）';else q='（较差）';return r+' dBm'+q;}
      document.getElementById('info-ssid').textContent=i.wifi_ssid||'-';
      document.getElementById('info-rssi').textContent=rssiLabel(i.wifi_rssi);
      document.getElementById('info-chan').textContent=i.wifi_channel||'-';
      document.getElementById('info-phy').textContent=i.wifi_phy||'-';
      document.getElementById('info-bssid').textContent=i.wifi_bssid||'-';
      if(i.eq_supported){document.getElementById('eq-card').style.display='';}
      document.getElementById('dev-name').placeholder=i.device_name||'';}}catch(e){}}
window.onload=function(){
  document.getElementById('fw-file').onchange=function(e){var f=e.target.files[0];
    document.getElementById('fw-name').textContent=f?f.name:'未选择文件';
    document.getElementById('ota-btn').disabled=!f;};
  loadInfo();loadBrightness();setInterval(loadInfo,30000);};
</script></body></html>
